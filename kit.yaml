# adorno — manifest
# Canonical source in src/, third-party imports in vendor/ (via `kit import`),
# generated output in dist/ (via `kit build`). Never edit dist/ or vendor/ by hand.

# Claude Code plugin name: commands are called /adorno:<name>.
name: adorno
version: 0.2.0
description: "Adorno, an agent that works like you: it reviews the PRs you are asked to review, answers the reviews you receive and opens your PRs, with your standards and your voice. Portable agent setup (Claude Code, Codex, Gemini CLI) built on addy/agent-skills and ponytail."

# Targets built by `kit build` and installed by default by `kit install`.
# Available: claude, codex, gemini, copilot, cursor (see adapters/targets.yaml).
targets: [claude, codex, gemini]

instructions:
  # Adds a one-line-per-workflow index to AGENTS.md (agents and skills are discovered natively).
  catalog: true

# Root YAML files shipped as JSON inside a skill (scripts read JSON with jq).
skill_data:
  adorno-github:
    repos.json: repos.yaml

# Agents, skills and workflows imported from other repos.
# `kit import` fetches them into vendor/<name>/ and pins the commit in kit.lock;
# `kit import --update` moves them to the latest version of `ref`.
#
#   source   github:owner/repo | git URL | local path
#   ref      branch, tag or commit (default: HEAD)
#   include  glob patterns relative to the repo (default: every folder containing a SKILL.md)
#   type     type of the .md files found outside skills: agent (default) or workflow
#   prefix   prefix added to names to avoid collisions
#
# A local item can extend an imported one without copying it:
#   extends: addy/code-reviewer   (its body is appended to the original)
imports:
  # 24 skills by phase (Define → Ship) and 3 reviewer agents (code, security, tests). MIT.
  - name: addy
    source: github:addyosmani/agent-skills
    ref: main
    include: ["skills/*", "agents/code-reviewer.md", "agents/security-auditor.md", "agents/test-engineer.md"]

  # "The least code that works" discipline + review, audit, debt ledger. MIT.
  - name: ponytail
    source: github:DietrichGebert/ponytail
    ref: main
    include: [skills/ponytail, skills/ponytail-review, skills/ponytail-audit, skills/ponytail-debt]

  # Browser QA: screenshots, WebM video, traces, test generation (`@playwright/cli` CLI). Apache-2.0.
  - name: playwright
    source: github:microsoft/playwright-cli
    ref: main
    include: [skills/playwright-cli]

  # Lightweight QA of a local app with Python Playwright: screenshots and console logs. Apache-2.0.
  - name: anthropic
    source: github:anthropics/skills
    ref: main
    include: [skills/webapp-testing]

  # Advanced TypeScript: types, guardrails, strict tsconfig. MIT.
  - name: jeffallan
    source: github:Jeffallan/claude-skills
    ref: main
    include: [skills/typescript-pro]
