description = "Fix a bug from a GitHub issue, a Slack thread, a Notion page, a prompt or a validated spec — investigation, red test, minimal fix, review and fix until clean, PR ready for review (\"Fixes"
prompt = '''
Input: {{args}}

**Run** — as soon as checkpoint 1 is passed (before it, everything is read-only): `adorno-github/scripts/run-begin --workflow workflow:issue:fix --mode auto --level <level validated at checkpoint 1> --repo owner/repo`; keep `id` and `dir` (the run folder). Called by another workflow that already opened its own: reuse it. Always, even after a failure: `run-end <id>`. Without an open run, the scripts refuse any write.

1. **What is reported**, in a new `.agent-run/` folder:
   - an issue (`owner/repo#N` or its link): `adorno-github/scripts/issue-fetch` → `issue.json`;
   - links (Slack thread where the bug is reported, Notion page) or a file: `adorno-inputs/scripts/input-refs` saved
     as `refs.json`, then `source.md` (skill `adorno-inputs`); an issue cited in the sources is read too;
   - an `.agent-run` folder with a validated `spec.md`: it stands in for the report;
   - only a description: it stands in for the report, and the repo must be named in it (or be the current clone).
2. `agent:fix:investigate` reproduces from this report and writes `diagnosis.md`. No repro possible → draft a reply
   (on the issue or the original thread, never posted) in English asking for what is missing, handed to the user;
   stop.
3. **Checkpoint 1**: diagnosis and level (L3 by default) validated by the user. Then
   `adorno-notion-sync start <.agent-run folder> owner/repo` (the Notion page of the report gets the repo's
   `notion_spec.start` properties; nothing to do without a Notion page or without that setting).
4. Branch `fix/<n>-<slug>` (no issue: `fix/<slug>`) from the base; the agent of the diagnosis's area (`pr-areas`
   `by_area.<a>.fix` for a `bug`, `.perf` for a `perf`), with the `skills` of that area: red test, fix, green suite.
5. `workflow:pr:ship owner/repo <branch> <worktree> <.agent-run folder>`, without asking: `commit_skill`, the review
   loop (area reviewers and `agent:adorno` against the diagnosis and the report: every 🔴 or 🟠 back to the `fix` or `perf`
   of its file's area, two rounds), then `pr_skill`, ready for review once clean, with `Fixes #N` in the description if there is an issue
   (otherwise the links of the sources, if the team can access them), then `workflow:pr:watch`.
'''
