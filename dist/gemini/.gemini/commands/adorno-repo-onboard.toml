description = "Prepare a repo for the agents — detect stack, commands and checks, write AGENTS.md and CONSTRAINTS.md, and propose its complete entry in local/adorno.yaml. Do it once per repo."
prompt = '''
Input: {{args}}

1. Local clone (nothing is published: no run to open): the given path, otherwise a clone in a temporary folder.
2. `agent:chore:repo` detects, verifies each command by running it, and writes `AGENTS.md` and `CONSTRAINTS.md` in a
   branch `chore/agents-onboarding` (without committing them: the user reviews first).
3. Declare the repo with the skill `adorno-setup`, mode `repo`: settings, permissions, voice, possibly a workspace,
   written to `local/adorno.yaml` (ignored by git) after validation, then `bin/kit install` on the repo. Nothing is
   written or committed in the tracked files of the adorno repo.
'''
