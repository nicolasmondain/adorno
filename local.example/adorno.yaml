# Template for local/adorno.yaml — copy the folder: cp -r local.example local (local/ is git-ignored).
#
# This is your personal layer: who you are, which repos the agents act on, with which permissions, how your agent
# writes, and your vision. `bin/kit install` merges it into the public defaults of repos.yaml; `bin/kit build` never reads it.
# See what a repo resolves to: `bin/kit conf owner/repo` (or, inside the repo, `adorno-github/scripts/repo-conf`).
#
# Resolution, weakest to strongest (each layer first expands its `use: [preset…]`):
#   public defaults (repos.yaml) → defaults below → workspaces that contain the repo (file order)
#   → matching `repos` keys with `*` (least specific first) → the exact `owner/repo` key.
# Merging: objects merge key by key, lists and values are replaced, except `context`, `vision` and the
# permissions (`permissions.deny`, `permissions.claude.*`) which add up from layer to layer: a more
# specific layer can add a denial, never remove one.

owner:                                 # you: the person agent:adorno represents
  name: Jane Doe
  github: janedoe                      # your GitHub login
  language: fr                         # language of exchanges with the agents (GitHub stays in English)

defaults:                              # your settings for all repos (on top of those in repos.yaml)
  voice:                               # how your agent writes (details: adorno-voice skill)
    tone: direct
    length: short
    emoji: never
    avoid: ["em dash", "I hope this helps"]
  vision:                              # vision lines valid everywhere (added to local/vision.md)
    - "Prefer deleting code to adding it."
  models:                              # which model for which task (details: docs/setup.md › Models)
    tiers:                             # each tier (fast, balanced, deep) → one model, per tool
      claude: {fast: haiku, balanced: sonnet, deep: opus}
      gemini: {fast: gemini-2.5-flash, balanced: gemini-2.5-pro, deep: gemini-2.5-pro}
    agents:                            # an agent on another tier, a specific model, or an external route
      agent:review:mongodb: deep
      # agent:core:triage: {route: openrouter-small}   # sends triage to OpenRouter: only if you want it
    workflows:                         # the model of the session that orchestrates a workflow (Claude Code)
      workflow:pr:status: fast
    routes:                            # OpenAI-compatible endpoints: OpenRouter, OpenAI, Google, your own models
      openrouter-small: {base_url: https://openrouter.ai/api/v1, model: qwen/qwen3-coder, api_key_env: OPENROUTER_API_KEY}
      ours: {base_url: https://llm.acme.internal/v1, model: acme-coder, api_key_env: ACME_LLM_KEY}
    # claude_env:                      # all of Claude Code through a gateway: written to .claude/settings.local.json
    #   ANTHROPIC_BASE_URL: https://openrouter.ai/api       # the key itself stays in your shell profile
    #   ANTHROPIC_DEFAULT_HAIKU_MODEL: qwen/qwen3-coder

presets:                               # shared blocks, reused via `use:` in a workspace or a repo
  platform-team:
    team:
      name: platform
      org: acme
      github_team: acme/platform
      slack: ["#platform"]
    reviewers: [alice, bob]            # default reviewers, never the author
    context:                           # short facts every agent must know (one line each)
      - "Priority order: a waiting customer > production errors > roadmap."

  careful:                             # restricted permissions, to apply where needed
    max_level: L2                      # L0 read · L1 local · L2 push to a branch · L3 PR, replies · L4 never auto
    permissions:
      deny: [submit, resolve]          # GitHub actions refused by the scripts: push, reply, comment, resolve,
                                       # rerequest, review (pending), submit, open_pr, ci_rerun
      claude:                          # native rules written to <repo>/.claude/settings.local.json on install
        deny: ["Bash(git push:*)"]
        ask: ["Bash(npm publish:*)"]

workspaces:                            # a whole set of repos at once
  acme:
    repos: ["acme/*"]                  # GitHub globs (`*` = one segment, `**` = everything)
    paths: ["~/code/acme"]             # local folders: the git repos found below (2 levels) are added
    use: [platform-team]
    permissions:
      claude:
        allow: ["Bash(npm test:*)", "Bash(npm run lint:*)"]

repos:                                 # a specific repo, or a glob (`acme/docs-*`)
  acme/app:
    context:
      - "Unit test coverage must stay >= 80%."
    impact:                            # workflow:pr:impact: where to measure the effect of merged PRs
      window: 7d
      sources:                         # hints for the agent; it also queries any other connector present
        - {tool: grafana, dashboard: "API latency", service: "app-api"}
        - {tool: sentry, project: "app"}
        - {tool: slack, channels: ["#platform-alerts"]}
        - {tool: posthog, events: ["team_settings_viewed"]}
    vision:
      - "On this repo, correctness beats speed: no shortcut on migrations."
    notion_spec:                       # a request whose spec is a Notion page: its properties at each step
      start: {Lifecycle: Ongoing, "Working date": "{{today}}"}   # spec or diagnosis validated, work starts
      pr_opened: {Lifecycle: "In Code Review"}                     # PR opened ({{pr_url}} available)
    pr_skill: /acme-pr                 # the repo's skill for writing a PR, if there is one
    setup_skill: null                  # skill that sets up a fresh worktree
    test: "npm test"
    lint: "npm run lint"

  acme/docs:
    use: [careful]
    models:
      external: false                  # nothing goes to an external model for this repo (routes ignored)
      agents: {agent:review:security: deep}
    voice: {formality: formal}         # public documentation: more formal register
    context:
      - "Public documentation: examples use obvious placeholders only, never real data."
    area_reviewers:                    # reviewers per code area (areas: repos.yaml › areas)
      docs: [agent:review:security]

slack:                                 # workflow:slack:watch and workflow:slack:mentions (Slack connector, read-only)
  user_id: U0123ABCD                   # your Slack ID: recipient of reports, target of mentions
  notify: dm                           # dm (message to yourself) | draft (draft, not sent) | none
  watches:                             # named rules: workflow:slack:watch <name>
    prod-timeouts:
      channels: ["#platform-alerts"]
      includes: ["Timeout", "ETIMEDOUT"]   # at least one word (case-insensitive, unless case_sensitive: true)…
      regex: 'took (\d{4,})ms'             # …or this regex
      since: 24h                           # 90m, 24h, 7d or a date
      max_messages: 200                    # messages read at most, most recent first
      threads: false                       # also read replies in threads
      action:                              # run on each matching message, once only
        agent: agent:core:analyst          # or workflow: workflow:issue:fix
        prompt: "Tie the error to a module and say whether it is new."
        level: L0                          # permission level of the action, for trusted authors only
        trusted_authors: [U0456EFGH]       # Slack IDs; any other author: the action runs at L0
  mentions:                            # workflow:slack:mentions: each mention → analysis + draft reply, to you only
    channels: ["#platform", "#product-bug"]   # empty = all channels
    groups: ["@platform-devs"]                # groups whose mention also counts
    since: 24h
    max_messages: 50

notion:                                # workflow:notion:assigned (Notion connector, read-only)
  assigned:
    properties: ["Assignee", "Owner"]  # "person" properties that count as assignment
    databases: []                      # links or names of the tracked databases; empty = the whole workspace
    exclude_status: ["Done", "Archived"]
    since: 30d
    max_messages: 20                   # documents processed at most per run
    agents:                            # what to launch depending on the database; otherwise agent:core:router chooses
      "Roadmap": workflow:spec:new
      "Bugs": workflow:issue:fix
    mode: report                       # report: analysis and plan · run: launches the agent or the workflow
    level: L0                          # permission level in run mode
