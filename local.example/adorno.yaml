# Modèle de local/adorno.yaml — copie le dossier : cp -r local.example local (local/ est ignoré par git).
#
# C'est ta couche personnelle : qui tu es, sur quels repos les agents agissent, avec quels droits, comment ton agent
# écrit, et ta vision. `bin/kit install` la mêle aux défauts publics de repos.yaml ; `bin/kit build` ne la lit jamais.
# Voir ce qu'un repo résout : `bin/kit conf owner/repo` (ou, dans le repo, `adorno-github/scripts/repo-conf`).
#
# Résolution, du plus faible au plus fort (chaque couche développe d'abord ses `use: [preset…]`) :
#   defaults publics (repos.yaml) → defaults ci-dessous → workspaces qui contiennent le repo (ordre du fichier)
#   → clés `repos` avec `*` qui correspondent (la moins précise d'abord) → la clé exacte `owner/repo`.
# Fusion : les objets se fusionnent clé par clé, listes et valeurs sont remplacées, sauf `context`, `vision` et les
# droits (`permissions.deny`, `permissions.claude.*`) qui s'additionnent d'une couche à l'autre : une couche plus
# précise peut ajouter un refus, jamais en retirer un.

owner:                                 # toi : la personne que agent:adorno représente
  name: Jane Doe
  github: janedoe                      # ton login GitHub
  language: fr                         # langue des échanges avec les agents (GitHub reste en anglais)

defaults:                              # tes réglages pour tous les repos (par-dessus ceux de repos.yaml)
  voice:                               # comment ton agent écrit (détail : skill adorno-voice)
    tone: direct
    length: short
    emoji: never
    avoid: ["em dash", "I hope this helps"]
  vision:                              # lignes de vision valables partout (s'ajoutent à local/vision.md)
    - "Prefer deleting code to adding it."
  models:                              # quel modèle pour quelle tâche (détail : docs/setup.md › Modèles)
    tiers:                             # chaque niveau (fast, balanced, deep) → un modèle, par outil
      claude: {fast: haiku, balanced: sonnet, deep: opus}
      gemini: {fast: gemini-2.5-flash, balanced: gemini-2.5-pro, deep: gemini-2.5-pro}
    agents:                            # un agent sur un autre niveau, un modèle précis, ou une route externe
      agent:review:mongodb: deep
      # agent:core:triage: {route: openrouter-small}   # envoie le tri à OpenRouter : seulement si tu le veux
    workflows:                         # le modèle de la session qui orchestre un workflow (Claude Code)
      workflow:pr:status: fast
    routes:                            # points d'accès compatibles OpenAI : OpenRouter, OpenAI, Google, tes modèles
      openrouter-small: {base_url: https://openrouter.ai/api/v1, model: qwen/qwen3-coder, api_key_env: OPENROUTER_API_KEY}
      ours: {base_url: https://llm.acme.internal/v1, model: acme-coder, api_key_env: ACME_LLM_KEY}
    # claude_env:                      # Claude Code entier via une passerelle : écrit dans .claude/settings.local.json
    #   ANTHROPIC_BASE_URL: https://openrouter.ai/api       # la clé, elle, reste dans ton profil shell
    #   ANTHROPIC_DEFAULT_HAIKU_MODEL: qwen/qwen3-coder

presets:                               # blocs partagés, réutilisés par `use:` dans un workspace ou un repo
  platform-team:
    team:
      name: platform
      org: acme
      github_team: acme/platform
      slack: ["#platform"]
    reviewers: [alice, bob]            # relecteurs par défaut, jamais l'auteur
    context:                           # faits courts que tout agent doit savoir (une ligne chacun)
      - "Priority order: a waiting customer > production errors > roadmap."

  careful:                             # droits restreints, à appliquer où il faut
    max_level: L2                      # L0 lecture · L1 local · L2 push sur une branche · L3 PR, réponses · L4 jamais auto
    permissions:
      deny: [submit, resolve]          # actions GitHub refusées par les scripts : push, reply, comment, resolve,
                                       # rerequest, review (en attente), submit (soumettre), open_pr, ci_rerun
      claude:                          # règles natives écrites dans <repo>/.claude/settings.local.json à l'install
        deny: ["Bash(git push:*)"]
        ask: ["Bash(npm publish:*)"]

workspaces:                            # tout un ensemble de repos d'un coup
  acme:
    repos: ["acme/*"]                  # globs GitHub (`*` = un segment, `**` = tout)
    paths: ["~/code/acme"]             # dossiers locaux : les repos git trouvés dessous (2 niveaux) sont ajoutés
    use: [platform-team]
    permissions:
      claude:
        allow: ["Bash(npm test:*)", "Bash(npm run lint:*)"]

repos:                                 # un repo précis, ou un glob (`acme/docs-*`)
  acme/app:
    context:
      - "Unit test coverage must stay >= 80%."
    impact:                            # workflow:pr:impact : où mesurer l'effet des PRs mergées
      window: 7d
      sources:                         # repères pour l'agent ; il interroge aussi tout autre connecteur présent
        - {tool: grafana, dashboard: "API latency", service: "app-api"}
        - {tool: sentry, project: "app"}
        - {tool: slack, channels: ["#platform-alerts"]}
        - {tool: posthog, events: ["team_settings_viewed"]}
    vision:
      - "On this repo, correctness beats speed: no shortcut on migrations."
    pr_skill: /acme-pr                 # skill du repo pour rédiger une PR, s'il y en a une
    setup_skill: null                  # skill d'installation d'un worktree neuf
    test: "npm test"
    lint: "npm run lint"

  acme/docs:
    use: [careful]
    models:
      external: false                  # rien ne part vers un modèle externe pour ce repo (routes ignorées)
      agents: {agent:review:security: deep}
    voice: {formality: formal}         # documentation publique : registre plus soutenu
    context:
      - "Public documentation: examples use obvious placeholders only, never real data."
    area_reviewers:                    # relecteurs par zone de code (zones : repos.yaml › areas)
      docs: [agent:review:security]

slack:                                 # workflow:slack:watch et workflow:slack:mentions (connecteur Slack, lecture seule)
  user_id: U0123ABCD                   # ton identifiant Slack : destinataire des comptes rendus, cible des mentions
  notify: dm                           # dm (message à toi-même) | draft (brouillon, non envoyé) | none
  watches:                             # règles nommées : workflow:slack:watch <nom>
    prod-timeouts:
      channels: ["#platform-alerts"]
      includes: ["Timeout", "ETIMEDOUT"]   # au moins un mot (insensible à la casse, sauf case_sensitive: true)…
      regex: 'took (\d{4,})ms'             # …ou cette regex
      since: 24h                           # 90m, 24h, 7d ou une date
      max_messages: 200                    # messages lus au plus, les plus récents d'abord
      threads: false                       # lire aussi les réponses dans les fils
      action:                              # lancé sur chaque message qui correspond, une seule fois
        agent: agent:core:analyst          # ou workflow: workflow:issue:fix
        prompt: "Rattache l'erreur à un module et dis si elle est nouvelle."
        level: L0                          # droits de l'action, pour les auteurs de confiance seulement
        trusted_authors: [U0456EFGH]       # identifiants Slack ; tout autre auteur : l'action tourne en L0
  mentions:                            # workflow:slack:mentions : chaque mention → analyse + brouillon de réponse, à toi seul
    channels: ["#platform", "#product-bug"]   # vide = tous les canaux
    groups: ["@platform-devs"]                # groupes dont la mention compte aussi
    since: 24h
    max_messages: 50

notion:                                # workflow:notion:assigned (connecteur Notion, lecture seule)
  assigned:
    properties: ["Assignee", "Owner"]  # propriétés « personne » qui valent assignation
    databases: []                      # liens ou noms des bases suivies ; vide = tout l'espace
    exclude_status: ["Done", "Archived"]
    since: 30d
    max_messages: 20                   # documents traités au plus par exécution
    agents:                            # quoi lancer selon la base ; sinon agent:core:router choisit
      "Roadmap": workflow:spec:new
      "Bugs": workflow:issue:fix
    mode: report                       # report : analyse et plan · run : lance l'agent ou le workflow
    level: L0                          # droits en mode run
