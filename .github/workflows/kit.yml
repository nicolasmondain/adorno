name: kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate sources and make sure dist/ is up to date
        run: ./bin/kit check --dist
      - name: Lint the scripts
        run: shellcheck -x -s bash -P SCRIPTDIR $(find src/skills -path '*/scripts/*' -type f ! -name '*.jq') tests/fake-gh tests/fake-curl tests/*.sh
      - name: Test the scripts (fake gh, fake curl, fixtures)
        run: for t in tests/*.test.sh; do $t; done
