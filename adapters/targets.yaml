# How each tool receives the neutral content of src/ and vendor/.
#
# skills     folder to copy skills into (Agent Skills format, identical everywhere)
# agents     format: native (claude | gemini | copilot) or `skill` = converted to a role skill
# workflows  format: native (claude-command | gemini-command | copilot-prompt | cursor-command) or `skill`
# instructions  files to create next to AGENTS.md; `shim` = block that imports AGENTS.md
# global     install into ~ (`kit install --global`): instructions file,
#            folder remapping (map) and unsupported folders (skip)
# tools      neutral capabilities -> native tool names
# models     neutral tiers (fast | balanced | deep | inherit) -> native models
#
# `verified: false` : paths taken from the public docs, not yet tested on your machine.

capabilities: [read, write, edit, search, shell, web, agent]
model_tiers: [inherit, fast, balanced, deep]

targets:
  claude:
    label: Claude Code
    skills: .claude/skills
    agents: {format: claude, dir: .claude/agents}
    workflows: {format: claude-command, dir: .claude/commands}
    instructions: {CLAUDE.md: shim}
    global:
      instructions: .claude/CLAUDE.md
    tools:
      read: [Read]
      write: [Write]
      edit: [Edit]
      search: [Grep, Glob]
      shell: [Bash]
      web: [WebFetch, WebSearch]
      agent: [Agent]
    models: {inherit: inherit, fast: haiku, balanced: sonnet, deep: opus}

  codex:
    label: OpenAI Codex
    skills: .agents/skills          # shared standard path (Codex, Amp, Kimi…)
    agents: {format: skill}
    workflows: {format: skill}
    instructions: {}                # lit AGENTS.md nativement
    global:
      instructions: .codex/AGENTS.md

  gemini:
    label: Gemini CLI
    skills: .gemini/skills
    agents: {format: gemini, dir: .gemini/agents}
    workflows: {format: gemini-command, dir: .gemini/commands, ext: .toml}
    instructions: {GEMINI.md: shim}
    global:
      instructions: .gemini/GEMINI.md
    tools:
      read: [read_file, read_many_files]
      write: [write_file]
      edit: [replace]
      search: [grep_search, glob, list_directory]
      shell: [run_shell_command]
      web: [web_fetch, google_web_search]
      agent: []
    models: {inherit: inherit}

  copilot:
    label: GitHub Copilot
    verified: false
    skills: .github/skills
    agents: {format: copilot, dir: .github/agents, ext: .agent.md}
    workflows: {format: copilot-prompt, dir: .github/prompts, ext: .prompt.md}
    instructions: {}                # lit AGENTS.md nativement
    global:
      map: {.github/skills: .copilot/skills}
      skip: [.github/agents, .github/prompts]
    tools:
      read: [read]
      write: [edit]
      edit: [edit]
      search: [search]
      shell: [execute]
      web: [web]
      agent: [agent]

  cursor:
    label: Cursor
    verified: false
    skills: .cursor/skills
    agents: {format: skill}
    workflows: {format: cursor-command, dir: .cursor/commands}
    instructions: {}                # lit AGENTS.md nativement
