# Public default settings, valid for every repo. Your repos, presets and workspaces live in
# local/adorno.yaml (git-ignored); `bin/kit install` writes the full registry to ~/.adorno/registry.json, outside
# any repo, which the scripts read. A repo declared nowhere is reported, never processed.
#
#   base             default branch (empty = read from GitHub)
#   install/test/lint/typecheck  commands; empty = detected by workflow:repo:onboard
#   required_checks  CI checks to wait for (empty = all)
#   reviewers        reviewers to re-request by default (empty = those who already reviewed)
#   resolve_threads  author | reviewer: who resolves a review thread
#   reply_language   language of replies published on GitHub
#   max_level        maximum permission level (L0 read … L3 PR; L4 merge is never automatic)
#   ponytail         lite | full | ultra
#   review_checks    in a review workspace: none | lint (lint + typecheck) | full (+ install and tests)
#                    default none: a point that needs execution is a ❓, CI decides (agent:adorno)
#   allow_approve    may an automatic review APPROVE? (false: only COMMENT and REQUEST_CHANGES)
#   max_inline       max inline comments per review; the rest goes in the body (agent:adorno: 8)
#   branch_pattern   regex a PR branch name must follow (default: <type>/kebab-description)
#   max_parallel     PRs processed at the same time by review:requested and review:received
#   areas            code areas: path patterns (bash globs, `*` crosses folders) and/or
#                    regexes on added lines; an area can be overridden per repo
#   area_reviewers   reviewer agents requested depending on the areas touched (`always` = every time)
#   impact           impact analysis of merged PRs (workflow:pr:impact): window compared before / after the
#                    deployment, minimum delay before analysing, sources to query (connectors and hints:
#                    dashboards, services, projects, alert channels), whether to post as a comment

defaults:
  base: null
  branch_pattern: '^(feat|fix|perf|refactor|test|docs|style|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$'
  resolve_threads: author
  reply_language: en
  max_level: L3
  ponytail: full
  review_checks: none
  allow_approve: false
  max_inline: 8
  max_parallel: 3

  # Native Claude Code rules installed everywhere (your user settings with --global, the repo's local settings with a
  # repo install). Agents publish through the adorno-github scripts, which check levels and permissions; these rules
  # stop the direct commands that would skip them. Add your own in local/adorno.yaml: lists accumulate.
  permissions:
    deny: []
    claude:
      deny:
        - "Bash(git push:*)"
        - "Bash(gh pr create:*)"
        - "Bash(gh pr comment:*)"
        - "Bash(gh pr review:*)"
        - "Bash(gh pr merge:*)"
        - "Bash(gh pr close:*)"
        - "Bash(gh pr edit:*)"
        - "Bash(gh issue comment:*)"
        - "Bash(gh issue create:*)"
        - "Bash(gh release:*)"
        - "Edit(~/.adorno/registry.json)"
        - "Write(~/.adorno/registry.json)"
        - "Edit(~/.adorno/runs/active/**)"
        - "Write(~/.adorno/runs/active/**)"
      # No rule on `gh api`: a native rule cannot tell a read from a write and asks even in bypassPermissions,
      # which blocks unattended runs. The shell guard (guard_bash.py) asks only for a write: a GraphQL mutation,
      # -f/-F/--input on REST, or a method other than GET/HEAD.

  impact:
    window: 7d            # same duration compared before and after the deployment
    min_age: 3d           # no analysis until the PR has been in production for this long
    environment: production
    post: comment         # comment: the report is posted as a PR comment · none: local report only
    post_public: false    # on a public repo, never post production figures in a comment, unless true
    sources: []           # your per-repo hints, in local/adorno.yaml (see local.example/)

  areas:
    front:
      paths: ["*.tsx", "*.jsx", "*.vue", "*.svelte", "*.css", "*.scss", "*.less", "*.html",
              "client/*", "*/client/*", "*/ui/*", "*/components/*", "*/pages/*"]
    back:
      paths: ["server/*", "*/server/*", "*/services/*", "*/jobs/*", "*/workers/*", "*/lib/*"]
    mongodb:
      paths: ["*/migrations/*", "*migration*", "*/collections/*", "*/models/*"]
      content: '\.aggregate\(|\.createIndex\(|\.find(One)?\(|\.(update|delete|insert)(One|Many)?\(|\.bulkWrite\(|Mongo\.Collection|rawCollection\(|\$lookup|\$match|\$group'
    api:
      paths: ["*/api/*", "*/routes/*", "*/methods/*", "*openapi*", "*/api-reference/*"]
    tests:
      paths: ["*.test.*", "*.spec.*", "*/tests/*", "*/__tests__/*", "*/test/*"]
    security:
      paths: ["*/auth/*", "*/permissions/*", "*.env*"]
      content: '(password|secret|token|api[_-]?key|jwt|bcrypt|crypto\.|permission|isAdmin|role)'
    deps:
      paths: ["package.json", "*/package.json", "*lock.json", "*.lock", "yarn.lock", "requirements*.txt", "go.mod"]
    ci:
      paths: [".github/*", "*Dockerfile*", "*docker-compose*"]
    docs:
      paths: ["*.md", "*.mdx", "docs/*"]

  area_reviewers:
    always: [agent:review:code, agent:review:ponytail]
    front: [agent:review:front, agent:review:perf]
    back: [agent:review:back, agent:review:tests]
    mongodb: [agent:review:mongodb]
    api: [agent:review:api]
    tests: [agent:review:tests]
    security: [agent:review:security]
    deps: [agent:review:security]
    ci: [agent:review:security]
    docs: []

# Your real repos (reviewers, team, context, permissions, voice, vision) live in local/adorno.yaml, git-ignored
# and applied by `bin/kit install`. Template: local.example/adorno.yaml. Result for a repo: `bin/kit conf`.
repos: {}
