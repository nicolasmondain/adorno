# Public default settings, valid for every repo. Your repos, presets and workspaces live in
# local/adorno.yaml (git-ignored); `bin/kit install` writes the full registry to ~/.adorno/registry.json, outside
# any repo, which the scripts read. A repo declared nowhere is reported, never processed.
#
#   base             default branch (empty = read from GitHub)
#   install/test/lint/typecheck  commands; empty = detected by workflow:repo:onboard
#   required_checks  CI checks to wait for (empty = all)
#   reviewers        reviewers to re-request by default (empty = those who already reviewed)
#   resolve_threads  author | reviewer: who resolves a review thread
#   reply_language   language of replies published on GitHub
#   max_level        maximum permission level (L0 read … L3 PR; L4 merge is never automatic)
#   ponytail         lite | full | ultra
#   review_checks    in a review workspace: none | lint (lint + typecheck) | full (+ install and tests)
#                    default none: a point that needs execution is a ❓, CI decides (agent:adorno)
#   allow_approve    may an automatic review APPROVE? (false: only COMMENT and REQUEST_CHANGES)
#   max_inline       max inline comments per review; the rest goes in the body (agent:adorno: 8)
#   branch_pattern   regex a PR branch name must follow (default: <type>/kebab-description)
#   max_parallel     PRs processed at the same time by review:requested and review:received
#   commit_skill     skill that commits what a workflow changed (the repo's own, or adorno-commit)
#   pr_skill         skill that opens the PR of a branch, or updates its title and description when it is open
#                    (the repo's own, or adorno-pr-open). workflow:pr:ship runs both, without asking, at the end of
#                    every workflow that touched code; a repo skill may push and run `gh pr create|edit` itself
#   areas            code areas, each with detection and roles. Detection: `paths` (bash globs, `*` crosses folders)
#                    and/or `content` (POSIX ERE run by awk on added lines: no `(?i)`, no `\d`). Roles: `build`, `fix`, `perf`, `qa` (one agent each) and
#                    `review`, `skills` (lists). `sub` holds sub-areas, one level only (`back.query`, `back.mongodb`):
#                    detected on their own `paths`/`content`, they add their files to the parent and inherit its roles
#                    (single role: own else parent's; list: parent's + own). `always` (`review`, `skills`) applies to
#                    every change. pr-areas turns a diff into the agents and skills to use.
#                    Override per repo: `paths`, `content` and single roles replace; `review` and `skills` add to
#                    the public list, and an entry `-x` removes `x` (e.g. `review: ["-agent:review:tests"]`)
#   fallbacks        `nit`, `test`: agent for work outside any area; `perf`: {agent, skills} used when no touched
#                    area has a `perf` agent
#   notion_spec      properties of the Notion page used as a run's spec, per step (`start`, `pr_opened`): property →
#                    value, `{{today}}`, `{{pr_url}}`; set in local/adorno.yaml only (adorno-notion-sync)
#   impact           impact analysis of merged PRs (workflow:pr:impact): window compared before / after the
#                    deployment, minimum delay before analysing, sources to query (connectors and hints:
#                    dashboards, services, projects, alert channels), whether to post as a comment

defaults:
  base: null
  branch_pattern: '^(feat|fix|perf|refactor|test|docs|style|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$'
  resolve_threads: author
  reply_language: en
  max_level: L3
  ponytail: full
  review_checks: none
  allow_approve: false
  max_inline: 8
  max_parallel: 3
  commit_skill: adorno-commit
  pr_skill: adorno-pr-open

  # Native Claude Code rules installed everywhere (your user settings with --global, the repo's local settings with a
  # repo install). Agents publish through the adorno-github scripts, which check levels and permissions; these rules
  # stop the direct commands that would skip them. Add your own in local/adorno.yaml: lists accumulate.
  permissions:
    deny: []
    claude:
      deny:
        - "Bash(gh pr comment:*)"
        - "Bash(gh pr review:*)"
        - "Bash(gh pr merge:*)"
        - "Bash(gh pr close:*)"
        - "Bash(gh issue comment:*)"
        - "Bash(gh issue create:*)"
        - "Bash(gh release:*)"
        - "Edit(~/.adorno/registry.json)"
        - "Write(~/.adorno/registry.json)"
        - "Edit(~/.adorno/runs/active/**)"
        - "Write(~/.adorno/runs/active/**)"
      # No rule on `gh api`: a native rule cannot tell a read from a write and asks even in bypassPermissions,
      # which blocks unattended runs. The shell guard (guard_bash.py) asks only for a write: a GraphQL mutation,
      # -f/-F/--input on REST, or a method other than GET/HEAD.
      # No rule on `git push` nor `gh pr create|edit` either: a native rule wins over the guard's `allow`, and the end
      # of a workflow (workflow:pr:ship) must push and open the PR without a prompt. The guard refuses (or asks) them
      # outside a run, forced, to the base, or beyond the run's level, max_level or permissions.deny.

  impact:
    window: 7d            # same duration compared before and after the deployment
    min_age: 3d           # no analysis until the PR has been in production for this long
    environment: production
    post: comment         # comment: the report is posted as a PR comment · none: local report only
    post_public: false    # on a public repo, never post production figures in a comment, unless true
    sources: []           # your per-repo hints, in local/adorno.yaml (see local.example/)

  areas:
    always:
      review: [agent:review:code, agent:review:ponytail]

    front:
      paths: ["*.tsx", "*.jsx", "*.vue", "*.svelte", "*.css", "*.scss", "*.less", "*.html",
              "client/*", "*/client/*", "*/ui/*", "*/components/*", "*/pages/*"]
      build: agent:feat:front
      fix: agent:fix:patch
      perf: agent:perf:front
      review: [agent:review:front, agent:review:perf]
      qa: agent:test:e2e
      skills: [frontend-ui-engineering]

    back:
      paths: ["server/*", "*/server/*", "*/services/*", "*/jobs/*", "*/workers/*", "*/lib/*"]
      build: agent:feat:back
      fix: agent:fix:patch
      perf: agent:perf:nodejs
      review: [agent:review:back, agent:review:tests, agent:review:perf-back]
      sub:
        query:
          content: '\.aggregate\(|\.find(One)?\(|\.(update|delete|insert)(One|Many)?\(|\.bulkWrite\(|rawCollection\(|\$lookup|\$match|\$group'
          perf: agent:perf:mongodb
          review: [agent:review:mongodb]
        mongodb:
          paths: ["*/migrations/*", "*migration*", "*/collections/*", "*/models/*"]
          content: '\.createIndex\(|Mongo\.Collection|new Schema\('
          perf: agent:perf:mongodb
          review: [agent:review:mongodb]
          skills: [deprecation-and-migration]

    api:
      paths: ["*/api/*", "*/routes/*", "*/methods/*", "*openapi*", "*/api-reference/*"]
      build: agent:feat:api
      review: [agent:review:api]
      skills: [api-and-interface-design]

    security:
      paths: ["*/auth/*", "*/permissions/*", "*.env*"]
      content: '(password|secret|token|api[_-]?key|jwt|bcrypt|crypto\.|permission|isAdmin|role)'
      fix: agent:fix:security
      review: [agent:review:security]
      skills: [security-and-hardening]

    typescript:
      paths: ["*.ts", "*.tsx", "*.mts", "*.cts", "tsconfig*.json"]
      skills: [typescript-pro]

    tests:
      paths: ["*.test.*", "*.spec.*", "*/tests/*", "*/__tests__/*", "*/test/*"]
      build: agent:test:unit
      fix: agent:test:unit
      review: [agent:review:tests]
      skills: [test-driven-development]

    e2e:
      paths: ["*.e2e.*", "*/e2e/*", "*playwright*"]
      build: agent:test:e2e
      fix: agent:test:e2e
      review: [agent:review:tests]
      skills: [webapp-testing, playwright-cli]

    deps:
      paths: ["package.json", "*/package.json", "*lock.json", "*.lock", "yarn.lock", "requirements*.txt", "go.mod"]
      build: agent:chore:deps
      fix: agent:chore:deps
      review: [agent:review:security, agent:review:ponytail]

    ci:
      paths: [".github/*", "*Dockerfile*", "*docker-compose*"]
      fix: agent:ci:fix
      review: [agent:review:security]
      skills: [ci-cd-and-automation]

    docs:
      paths: ["*.md", "*.mdx", "docs/*"]
      build: agent:docs:write
      fix: agent:docs:write
      skills: [documentation-and-adrs]

  # Agents for work that belongs to no single area: a nit, a missing test, and `perf` when no touched area has one.
  fallbacks:
    nit: agent:refactor:simplify
    test: agent:test:unit
    perf: { agent: agent:fix:patch, skills: [performance-optimization] }

# Your real repos (reviewers, team, context, permissions, voice, vision) live in local/adorno.yaml, git-ignored
# and applied by `bin/kit install`. Template: local.example/adorno.yaml. Result for a repo: `bin/kit conf`.
repos: {}
