<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>adorno — run journal</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <h1><a href="#" id="home">adorno</a> <span>run journal</span></h1>
    <p id="status" role="status"></p>
  </header>

  <main>
    <section id="picker" aria-label="Runs"></section>

    <section id="stage" aria-label="Replay" data-state="paused" hidden>
      <div class="bar" role="toolbar" aria-label="Playback">
        <button id="back" aria-label="Previous event" title="Previous event (←)">◂</button>
        <button id="play" title="Play or pause (Space)">Play</button>
        <button id="forward" aria-label="Next event" title="Next event (→)">▸</button>
        <label>speed
          <select id="speed"></select>
        </label>
        <input id="scrub" type="range" min="0" max="1000" value="1000" step="1" aria-label="Position in the run">
        <output id="clock" aria-live="off" aria-label="Elapsed time"></output>
        <output id="spent" aria-live="off" aria-label="Tokens so far"></output>
      </div>
      <div class="bar" role="toolbar" aria-label="View">
        <label>view
          <select id="view">
            <option value="everything">everything</option>
            <option value="agents">agents only</option>
            <option value="tokens">tokens</option>
            <option value="workflow">workflow</option>
          </select>
        </label>
        <button id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
        <button id="zoom-fit" title="Fit the whole run (0)">fit</button>
        <button id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <span class="tabs" role="tablist" aria-label="Diagram or text">
          <button id="tab-diagram" role="tab" aria-selected="true" aria-controls="diagrams">diagram</button>
          <button id="tab-log" role="tab" aria-selected="false" aria-controls="log">text log</button>
        </span>
        <button id="reload" title="Read the run again (R)">reload</button>
        <button id="choose" aria-expanded="false" aria-controls="picker">compare with…</button>
        <button id="uncompare" hidden>stop comparing</button>
        <button id="help-open" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
      </div>
      <p id="note" class="note"></p>
      <div id="delta"></div>
      <div id="diagrams" role="tabpanel" aria-labelledby="tab-diagram"></div>
      <div id="log" role="tabpanel" aria-labelledby="tab-log" hidden></div>
      <p id="live" class="sr" aria-live="polite"></p>
    </section>
  </main>

  <aside id="panel" aria-label="Detail" hidden></aside>

  <dialog id="help" aria-label="Keyboard shortcuts">
    <h2>Keyboard</h2>
    <dl id="keys"></dl>
    <button id="help-close">close</button>
  </dialog>
</body>
</html>
